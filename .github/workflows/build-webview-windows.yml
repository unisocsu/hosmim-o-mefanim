name: Build Windows WebView2 EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-webview/**"
      - "index.html"
      - "three.min.js"
      - "fonts.css"
      - "fonts/**"
      - "intro.mp4"
      - "cops.mp4"
      - "icon-*.png"
      - ".github/workflows/build-webview-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file Windows EXE
        run: >
          dotnet publish desktop-webview/HosmimEtHatzir.WebView.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - name: Create distributable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/HosmimEtHatzir.exe dist/HosmimEtHatzir.exe
          Copy-Item publish/app dist/app -Recurse -Force

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath HosmimEtHatzir-WebView2-Windows.zip

      - name: Upload EXE and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HosmimEtHatzir-WebView2-Windows
          path: |
            dist/HosmimEtHatzir.exe
            HosmimEtHatzir-WebView2-Windows.zip
